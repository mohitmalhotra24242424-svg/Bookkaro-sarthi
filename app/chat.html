<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>BookKro Sarthi — Chat</title>
<style>
  :root {
    --cream: #FFF8EF; --cream-2: #FBEFE0; --card: #FFFFFF;
    --ink: #142B3D; --ink-2: #102A43; --muted: #5D6B78; --faint: #8A9298;
    --orange: #F56B2A; --orange-dark: #DE5A1F; --orange-soft: #FDEBDC;
    --teal: #24A88F; --teal-deep: #159889; --teal-soft: #E2F4F0;
    --line: #E8E1D8; --line-2: #E6EDF2;
    --shadow: 0 1px 2px rgba(20,43,61,.04), 0 12px 32px rgba(20,43,61,.07);
    --grad: linear-gradient(140deg, #F97332, #F56B2A);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
    background: var(--cream); color: var(--ink); line-height: 1.55;
    -webkit-font-smoothing: antialiased; display: flex; flex-direction: column;
    height: 100dvh; overflow: hidden;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  /* ── header ── */
  .hd {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: rgba(251,247,239,.9); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line); z-index: 20; padding-top: max(10px, env(safe-area-inset-top));
  }
  .back {
    width: 38px; height: 38px; border-radius: 12px; border: 1.5px solid var(--line-2);
    background: var(--card); font-size: 17px; cursor: pointer; color: var(--ink);
    display: grid; place-items: center; transition: border-color .15s;
  }
  .back:hover { border-color: var(--orange); }
  .orb {
    width: 38px; height: 38px; border-radius: 12px; background: var(--grad);
    display: grid; place-items: center; font-size: 19px; box-shadow: 0 6px 14px rgba(245,107,42,.3);
  }
  .ht { line-height: 1.2; min-width: 0; }
  .ht b { font-size: 15px; font-weight: 800; letter-spacing: -.2px; }
  .st { font-size: 11.5px; font-weight: 700; color: var(--faint); display: flex; align-items: center; gap: 5px; }
  .st::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .st.on { color: var(--teal); }
  .st.off { color: #D64545; }
  .st.wait { color: var(--orange); }

  /* ── chat scroll ── */
  main { flex: 1; overflow-y: auto; padding: 18px 14px 6px; }
  .chat { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 11px; }

  .welcome { text-align: center; padding: 30px 8px 8px; }
  .welcome .big {
    width: 74px; height: 74px; margin: 0 auto 14px; border-radius: 24px; background: var(--grad);
    display: grid; place-items: center; font-size: 36px; box-shadow: 0 14px 30px rgba(245,107,42,.3);
  }
  .welcome .ava {
    width: 96px; height: 96px; object-fit: cover; object-position: 50% 18%;
    margin: 0 auto 14px; border-radius: 28px; border: 3px solid #fff; display: block;
    box-shadow: 0 14px 30px rgba(245,107,42,.25);
  }
  .welcome h2 { font-size: 21px; font-weight: 850; letter-spacing: -.4px; }
  .welcome p { color: var(--muted); font-size: 13.5px; margin-top: 5px; }
  .safe { max-width: 760px; margin: 7px auto 0; text-align: center; font-size: 11px; color: var(--faint); }

  .msg {
    max-width: 86%; padding: 11px 15px; border-radius: 17px; font-size: 14.5px;
    line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    animation: rise .3s ease;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .u { align-self: flex-end; background: var(--grad); color: #fff; border-radius: 18px; border-bottom-right-radius: 6px; box-shadow: 0 6px 16px rgba(245,107,42,.22); }
  .b { background: var(--card); border: 1px solid var(--line); border-radius: 18px; border-bottom-left-radius: 6px; box-shadow: var(--shadow); }
  .b-row { display: flex; align-items: flex-end; gap: 8px; align-self: flex-start; max-width: 92%; }
  .b-row .msg { max-width: 100%; }
  .mini-orb {
    flex: 0 0 auto; width: 34px; height: 34px; border-radius: 12px; background: var(--grad);
    display: grid; place-items: center; font-size: 16px; box-shadow: 0 4px 10px rgba(245,107,42,.3);
  }
  .tag { align-self: flex-start; font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); margin: -5px 0 0 8px; }

  .dots { align-self: flex-start; margin-left: 42px; display: flex; gap: 5px; padding: 14px 17px; background: var(--card); border: 1px solid var(--line); border-radius: 17px; box-shadow: var(--shadow); }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); animation: blink 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .18s; } .dots i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }

  /* cards + panels */
  .cards { display: flex; flex-direction: column; gap: 10px; align-self: stretch; width: 100%; }
  .tcard { border: 1px solid var(--line); background: var(--card); border-radius: 15px; padding: 13px 15px; box-shadow: var(--shadow); transition: border-color .15s; }
  .tcard:hover { border-color: var(--orange); }
  .t-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .t-no { font-weight: 850; font-size: 15.5px; color: var(--orange-dark); }
  .t-name { font-size: 13.5px; color: var(--ink-2); }
  .t-od { margin-top: 6px; font-size: 13px; font-weight: 750; color: var(--ink-2); }
  .t-seg { margin-top: 2px; font-size: 12px; color: var(--muted); font-weight: 650; }
  .t-times { display: flex; gap: 16px; margin-top: 7px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
  .t-times b { color: var(--ink); font-weight: 700; }
  .caps { display: flex; gap: 5px; margin-top: 9px; flex-wrap: wrap; }
  .cap { font-size: 12px; font-weight: 800; border: 1.5px solid var(--line-2); border-radius: 999px; padding: 6px 12px; color: var(--ink); background: var(--cream); cursor: pointer; font-family: inherit; }
  .cap.hot { border-color: #F4C9A8; color: var(--orange-dark); background: var(--orange-soft); }
  .cap:hover, .cap:focus { border-color: var(--orange); background: var(--orange-soft); color: var(--orange-dark); }
  .cap:active { transform: scale(.96); }
  .tcard { cursor: pointer; }
  .caps-hint { font-size: 11px; color: var(--faint); margin-top: 8px; font-weight: 650; }

  .panel { align-self: stretch; width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 15px; padding: 13px 15px; box-shadow: var(--shadow); }
  .panel.accent { border-color: #B9D6D2; background: linear-gradient(180deg, var(--teal-soft), var(--card) 60%); }
  .p-title { font-size: 10.5px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
  .p-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 3.5px 0; }
  .p-row.total { border-top: 1.5px dashed var(--line-2); margin-top: 6px; padding-top: 8px; font-weight: 850; color: var(--ink); }
  .p-row .val { color: var(--ink); font-weight: 650; }
  .p-prog { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); font-weight: 650; }
  .pdots { display: flex; gap: 5px; }
  .pdot { width: 9px; height: 9px; border-radius: 999px; background: var(--line-2); }
  .pdot.on { background: var(--teal); }

  /* chips */
  .chips-wrap { padding: 6px 14px 2px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; max-width: 760px; margin: 0 auto; padding: 4px 2px 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 1.5px solid var(--line-2); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 9px 15px; font-size: 13px; font-weight: 650; cursor: pointer;
    transition: all .15s; box-shadow: 0 1px 3px rgba(35,38,46,.05);
  }
  .chip:hover { border-color: var(--orange); background: var(--orange-soft); color: var(--orange-dark); transform: translateY(-2px); }
  .chip { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .chip:active { transform: scale(.96); }

  /* composer */
  .comp-wrap { padding: 6px 14px calc(12px + env(safe-area-inset-bottom)); }
  .comp {
    max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 8px;
    background: var(--card); border: 1.5px solid var(--line-2); border-radius: 999px;
    padding: 7px 7px 7px 18px; box-shadow: 0 10px 30px rgba(35,38,46,.1); transition: border-color .2s;
  }
  .comp:focus-within { border-color: var(--orange); }
  .comp input { flex: 1; border: 0; outline: none; font-size: 15.5px; background: none; color: var(--ink); min-width: 0; font-family: inherit; }
  .comp input::placeholder { color: var(--faint); }
  .mic, .go {
    flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
    display: grid; place-items: center; font-size: 18px; transition: all .15s;
  }
  .mic { border: 1.5px solid var(--line-2); background: var(--cream); color: var(--ink-2); }
  .mic:hover { border-color: var(--teal); background: var(--teal-soft); }
  .mic.rec { background: var(--orange); border-color: var(--orange); color: #fff; animation: recpulse 1.1s infinite; }
  @keyframes recpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(245,107,42,.45); } 50% { box-shadow: 0 0 0 9px rgba(245,107,42,0); } }
  .go { border: 0; background: var(--orange); color: #fff; box-shadow: 0 6px 16px rgba(245,107,42,.35); }
  .go:hover { background: var(--orange-dark); transform: scale(1.07); }
  .go:disabled { opacity: .45; cursor: not-allowed; transform: none; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header class="hd">
  <button class="back" id="home" type="button" title="Home" aria-label="Home">←</button>
  <div class="orb">🚆</div>
  <div class="ht"><b>BookKro Sarthi</b><div class="st wait" id="status">checking…</div></div>
</header>

<main id="scroll">
  <div class="chat" id="chat">
    <div class="welcome" id="welcome">
      <img class="ava" src="assets/pose-1-namaste.jpg" alt="BookKro Sarthi assistant" />
      <h2>Namaste! 🙏 Main BookKro Sarthi hoon</h2>
      <p>Bataiye, main aapki kaise madad kar sakti hoon? — Hinglish • हिंदी • English 👇</p>
    </div>
  </div>
</main>

<div class="chips-wrap">
  <div class="chips" id="chips">
    <button class="chip" type="button">Train search: Amritsar se Ludhiana</button>
    <button class="chip" type="button">12014 ka live status</button>
    <button class="chip" type="button">Seat availability: NDLS to LDH</button>
    <button class="chip" type="button">Mera PNR check karo</button>
    <button class="chip" type="button">CC kya hota hai?</button>
    <button class="chip" type="button">aaj ki cancelled trains batao</button>
  </div>
</div>

<div class="comp-wrap">
  <form class="comp" id="form">
    <input id="input" type="text" placeholder="Type your message..." autocomplete="off" aria-label="Message" />
    <button class="mic" id="mic" type="button" aria-label="Bolkar poochho" title="Bolkar poochho" hidden>🎙</button>
    <button class="go" id="go" type="submit" aria-label="Send" title="Send">➤</button>
  </form>
  <div class="safe">🔒 Your conversations are safe with BookKro Sarthi</div>
</div>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  var chat = $('chat'), scroll = $('scroll'), form = $('form'), input = $('input'), go = $('go');
  var statusEl = $('status');
  var micBtn = $('mic');
  var conversationId = null, online = false, sending = false, autoFired = false, pendingQ = null;

  /* Same-origin backend only — settings UI removed for a clean chat experience. */
  function base() { return ''; }
  function api(path, options) { return fetch((base() || '') + path, options); }

  function down() { scroll.scrollTop = scroll.scrollHeight; }
  function welcome() { var w = $('welcome'); if (w) w.remove(); }
  function addMsg(text, who) {
    welcome();
    var el = document.createElement('div');
    el.className = 'msg ' + who;
    el.textContent = text;
    if (who === 'b') {
      var row = document.createElement('div'); row.className = 'b-row';
      var orb = document.createElement('div'); orb.className = 'mini-orb'; orb.textContent = '🚆';
      row.appendChild(orb); row.appendChild(el);
      chat.appendChild(row);
    } else {
      chat.appendChild(el);
    }
    down();
    return el;
  }
  function addTag(text) {
    if (!text) return;
    var el = document.createElement('div');
    el.className = 'tag';
    el.textContent = text;
    chat.appendChild(el); down();
  }
  function typing(on) {
    var t = $('dots');
    if (on && !t) {
      t = document.createElement('div'); t.id = 'dots'; t.className = 'dots';
      t.innerHTML = '<i></i><i></i><i></i>';
      chat.appendChild(t); down();
    }
    if (!on && t) t.remove();
  }
  function inr(minor) { return minor == null ? '?' : '\u20B9' + (minor / 100).toFixed(2); }

  function addCards(cards) {
    if (!cards || !cards.length) return;
    var wrap = document.createElement('div'); wrap.className = 'cards';
    cards.forEach(function (card, index) {
      var el = document.createElement('div'); el.className = 'tcard';
      var head = document.createElement('div'); head.className = 't-head';
      var no = document.createElement('span'); no.className = 't-no'; no.textContent = (index + 1) + '. ' + card.number;
      var name = document.createElement('span'); name.className = 't-name'; name.textContent = card.name || '';
      head.appendChild(no); head.appendChild(name);
      el.appendChild(head);
      function stLabel(code, name) {
        if (name && code) return name + ' (' + code + ')';
        return name || code || '';
      }
      var origL = stLabel(card.originCode, card.originName);
      var destL = stLabel(card.destCode, card.destName);
      var fromL = stLabel(card.fromCode, card.fromName);
      var toL = stLabel(card.toCode, card.toName);
      if (origL && destL) {
        var od = document.createElement('div'); od.className = 't-od';
        od.textContent = origL + ' → ' + destL;
        el.appendChild(od);
      }
      if (fromL && toL && (fromL !== origL || toL !== destL)) {
        var seg = document.createElement('div'); seg.className = 't-seg';
        seg.textContent = fromL + ' → ' + toL;
        el.appendChild(seg);
      } else if ((!origL || !destL) && fromL && toL) {
        var only = document.createElement('div'); only.className = 't-od';
        only.textContent = fromL + ' → ' + toL;
        el.appendChild(only);
      }
      var times = document.createElement('div'); times.className = 't-times';
      var dep = document.createElement('span'); dep.innerHTML = 'Dep <b>' + (card.departureTime || '?') + '</b>';
      var arr = document.createElement('span'); arr.innerHTML = 'Arr <b>' + (card.arrivalTime || '?') + '</b>';
      var dur = document.createElement('span');
      dur.textContent = card.durationMinutes != null ? Math.floor(card.durationMinutes / 60) + 'h ' + (card.durationMinutes % 60) + 'm' : '';
      times.appendChild(dep); times.appendChild(arr); times.appendChild(dur);
      el.appendChild(times);
      if (card.classes && card.classes.length) {
        var caps = document.createElement('div'); caps.className = 'caps';
        card.classes.forEach(function (code, i) {
          var chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'cap' + (i === 0 ? ' hot' : '');
          chip.textContent = code;
          chip.setAttribute('data-train', card.number);
          chip.setAttribute('data-class', code);
          chip.setAttribute('aria-label', card.number + ' ' + code + ' seat');
          caps.appendChild(chip);
        });
        el.appendChild(caps);
        var hint = document.createElement('div'); hint.className = 'caps-hint';
        hint.textContent = 'Class pe tap karke seat choose karein';
        el.appendChild(hint);
      }
      wrap.appendChild(el);
    });
    chat.appendChild(wrap); down();
  }

  function addPanel(panel) {
    if (!panel) return;
    var el = document.createElement('div'); el.className = 'panel' + (panel.kind === 'review' ? ' accent' : '');
    if (panel.kind === 'fare') {
      var t = document.createElement('div'); t.className = 'p-title';
      t.textContent = 'Fare summary' + (panel.travelClass ? ' \u00B7 ' + panel.travelClass : ''); el.appendChild(t);
      [['Railway fare', panel.railwayFareMinor], ['Service fee', panel.serviceFeeMinor], ['Total payable', panel.totalPayableMinor]]
        .forEach(function (pair, i) {
          var r = document.createElement('div'); r.className = 'p-row' + (i === 2 ? ' total' : '');
          r.innerHTML = '<span>' + pair[0] + '</span><span class="val">' + inr(pair[1]) + '</span>';
          el.appendChild(r);
        });
    } else if (panel.kind === 'review') {
      var rt = document.createElement('div'); rt.className = 'p-title'; rt.textContent = 'Booking review'; el.appendChild(rt);
      var s = panel.summary || {};
      [['Train', s.trainNumber ? (s.trainNumber + (s.trainName ? ' \u2014 ' + s.trainName : '')) : null],
       ['Journey', s.originCode && s.destinationCode ? (s.originCode + ' \u2192 ' + s.destinationCode) : null],
       ['Date', s.journeyDate], ['Class', s.travelClass],
       ['Passengers', s.passengerCount ? String(s.passengerCount) : null],
       ['Availability', s.availabilityStatus],
       ['Railway fare', s.railwayFareMinor != null ? inr(s.railwayFareMinor) : null],
       ['Service fee', s.serviceFeeMinor != null ? inr(s.serviceFeeMinor) : null]
      ].forEach(function (pair) {
        if (pair[1] == null) return;
        var r = document.createElement('div'); r.className = 'p-row';
        r.innerHTML = '<span>' + pair[0] + '</span><span class="val">' + pair[1] + '</span>';
        el.appendChild(r);
      });
      if (s.totalPayableMinor != null) {
        var tot = document.createElement('div'); tot.className = 'p-row total';
        tot.innerHTML = '<span>Total payable</span><span class="val">' + inr(s.totalPayableMinor) + '</span>';
        el.appendChild(tot);
      }
    } else if (panel.kind === 'passengers') {
      var pt = document.createElement('div'); pt.className = 'p-title'; pt.textContent = panel.label || 'Passengers';
      var prog = document.createElement('div'); prog.className = 'p-prog';
      var dots = document.createElement('div'); dots.className = 'pdots';
      for (var i = 0; i < (panel.total || 1); i++) {
        var d = document.createElement('span'); d.className = 'pdot' + (i < panel.current ? ' on' : '');
        dots.appendChild(d);
      }
      var lab = document.createElement('span'); lab.textContent = panel.current + ' of ' + (panel.total || 1);
      prog.appendChild(dots); prog.appendChild(lab);
      el.appendChild(pt); el.appendChild(prog);
    }
    chat.appendChild(el); down();
  }

  /* ── send: queues during in-flight instead of dropping taps (chip fix) ── */
  var queued = null;
  function hideStarterChips() {
    var starter = $('chips');
    if (starter && starter.parentNode) starter.parentNode.style.display = 'none';
  }
  function send(text) {
    text = (text || '').trim();
    if (!text) return;
    if (sending) { queued = text; setChipsBusy(true); return; } // queue the tap, never drop
    hideStarterChips();
    addMsg(text, 'u');
    if (input) input.value = '';
    sending = true; if (go) go.disabled = true;
    typing(true);
    var settled = false;
    var timeoutId = setTimeout(function () {
      if (settled) return; settled = true;
      typing(false); addMsg('Jawab mein zyada time lag raha hai — thodi der baad try karein.', 'b');
      sending = false; if (go) go.disabled = false;
    }, 45000);
    api('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ message: text, conversationId: conversationId }) })
      .then(function (r) {
        if (!r.ok) throw new Error('http ' + r.status);
        return r.json();
      })
      .then(function (data) {
        if (settled) return; settled = true; clearTimeout(timeoutId);
        typing(false);
        if (data.conversationId) conversationId = data.conversationId;
        addMsg(data.reply || '…', 'b');
        if (data.cards && data.cards.length) addCards(data.cards);
        if (data.panel) addPanel(data.panel);
        addTag(data.intent && data.intent !== 'UNKNOWN' ? data.intent : '');
        hideStarterChips();
        if (window.__refreshChips) {
          window.__refreshChips(String(data.reply || '').split('\n').pop(), data.chips);
        }
      })
      .catch(function () {
        if (settled) return; settled = true; clearTimeout(timeoutId);
        typing(false);
        setStatus(false, '\u25CF offline');
        addMsg('Backend se connect nahi ho paaya — thodi der baad dobara try karein. 🙏', 'b');
      })
      .then(function () {
        sending = false; if (go) go.disabled = false; setChipsBusy(false);
        if (queued) { var next = queued; queued = null; send(next); }
        else if (input) input.focus();
      });
  }

  /* ── status ── */
  function setStatus(ok, label) {
    online = ok;
    statusEl.className = 'st ' + (ok ? 'on' : 'off');
    statusEl.textContent = label || (ok ? 'online \u00B7 AI ready' : 'offline');
  }
  function checkHealth(after) {
    statusEl.className = 'st wait'; statusEl.textContent = 'checking\u2026';
    api('/api/health')
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function () { setStatus(true); if (after) after(); })
      .catch(function () {
        setStatus(false);
        if (after) after();
      });
  }

  /* ── wiring ── */
  if (form) form.addEventListener('submit', function (e) { e.preventDefault(); send(input.value); });
  // Tap-proof chips: pointerdown fires instantly on mobile; click is a deduped fallback.
  var lastChipAt = 0;
  var lastChipText = '';
  function chipTap(el) {
    if (!el || !el.classList || !el.classList.contains('chip')) return;
    var now = Date.now();
    if (el.textContent === lastChipText && now - lastChipAt < 800) return; // dedupe
    lastChipAt = now; lastChipText = el.textContent || '';
    el.style.transform = 'scale(.94)';
    setTimeout(function () { el.style.transform = ''; }, 140);
    send(el.textContent);
  }
  function setChipsBusy(busy) {
    document.querySelectorAll('.chip').forEach(function (el) { el.style.opacity = busy ? '.5' : ''; });
  }
  var chipsEl = $('chips');
  if (chipsEl) {
    chipsEl.addEventListener('pointerdown', function (e) { chipTap(e.target); });
    chipsEl.addEventListener('click', function (e) { chipTap(e.target); });
  }
  if ($('home')) $('home').addEventListener('click', function () { location.href = 'index.html'; });

  /* ── voice (browser-native; hidden when unsupported) ── */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (micBtn && SR) {
    micBtn.hidden = false;
    var busy = false;
    micBtn.addEventListener('click', function () {
      if (busy) return;
      var rec = new SR();
      busy = true;
      micBtn.classList.add('rec');
      micBtn.title = 'Sun rahi hoon\u2026';
      rec.lang = 'hi-IN'; rec.interimResults = false; rec.maxAlternatives = 1;
      rec.onresult = function (e) {
        var said = e.results && e.results[0] && e.results[0][0] ? e.results[0][0].transcript : '';
        if (said) send(said);
      };
      rec.onerror = function () { if (input) input.placeholder = 'Voice samajh nahi aaya \u2014 likh kar bhejein'; };
      rec.onend = function () { busy = false; micBtn.classList.remove('rec'); micBtn.title = 'Bolkar poochho'; };
      try { rec.start(); } catch (err) { busy = false; micBtn.classList.remove('rec'); }
    });
  }

  /* ── dynamic quick-answer chips for the pending question (passenger details etc.) ── */
  var CHIP_SETS = {
    gender: ['M', 'F', 'T'],
    age: ['28', '30', '35', '45', '60'],
    count: ['1', '2', '3', '4', '5', '6'],
    yesno: ['haan', 'nahi']
  };
  function detectChipKind(text) {
    var t = (text || '').toLowerCase();
    if (/gender/.test(t)) return 'gender';
    if (/age kitni|\bage\b/.test(t)) return 'age';
    if (/kitne passengers|passengerCount/.test(t)) return 'count';
    if (/confirm/i.test(t) || /phir bhi book/.test(t)) return 'yesno';
    return null;
  }
  function classesFromReply(text) {
    var m = String(text || '').match(/class chahiye\?\s*\(([^)]+)\)/i);
    if (!m) return null;
    var parts = m[1].split(/[,/]/).map(function (s) { return s.trim().toUpperCase(); }).filter(function (s) {
      return /^[A-Z0-9]{1,3}$/.test(s);
    });
    return parts.length ? parts : null;
  }
  function berthsFromReply(text) {
    var m = String(text || '').match(/berth preference\?\s*\(([^)]+)\)/i);
    if (!m) return null;
    var parts = m[1].split(/[\/,]/).map(function (s) {
      return s.replace(/chip se tap karein/ig, '').trim();
    }).filter(function (s) { return s && !/^chip/i.test(s); });
    if (!parts.length) return null;
    if (parts.indexOf('koi nahi') < 0) parts.push('koi nahi');
    return parts;
  }
  var dynamicWrap = document.createElement('div');
  dynamicWrap.className = 'chips-wrap';
  dynamicWrap.id = 'dyn-chips-wrap';
  dynamicWrap.style.display = 'none';
  var dynChips = document.createElement('div');
  dynChips.className = 'chips';
  dynamicWrap.appendChild(dynChips);
  document.querySelector('.comp-wrap').parentNode.insertBefore(dynamicWrap, document.querySelector('.comp-wrap'));
  function refreshDynamicChips(lastBotReply) {
    var kind = detectChipKind(lastBotReply);
    if (!kind) { dynamicWrap.style.display = 'none'; dynChips.innerHTML = ''; return; }
    dynChips.innerHTML = '';
    (CHIP_SETS[kind] || []).forEach(function (v) {
      var b = document.createElement('button');
      b.className = 'chip'; b.type = 'button'; b.textContent = v;
      dynChips.appendChild(b);
    });
    dynamicWrap.style.display = 'block';
    setChipsBusy(sending);
  }
  dynChips.addEventListener('pointerdown', function (e) { chipTap(e.target); });
  dynChips.addEventListener('click', function (e) { chipTap(e.target); });

  // Class chip tap = that train + class. Card body tap = that train.
  chat.addEventListener('click', function (e) {
    var cap = e.target && e.target.closest ? e.target.closest('.cap') : null;
    if (cap) {
      e.preventDefault();
      e.stopPropagation();
      var train = cap.getAttribute('data-train') || '';
      var cls = cap.getAttribute('data-class') || String(cap.textContent || '').trim();
      if (train && cls) send(train + ' mein ' + cls + ' chahiye');
      else if (cls) send(cls + ' chahiye');
      return;
    }
    var card = e.target && e.target.closest ? e.target.closest('.tcard') : null;
    if (!card) return;
    var idx = Array.prototype.indexOf.call(chat.querySelectorAll('.tcard'), card);
    var no = card.querySelector('.t-no');
    var trainNo = no ? (String(no.textContent || '').replace(/^\d+\.\s*/, '').trim().split(' ')[0]) : '';
    var ordinals = ['pehli wali', 'doosri wali', 'teesri wali', 'chauthi wali', 'paanchvi wali', 'chhati wali'];
    if (trainNo && /^\d+$/.test(trainNo)) send(trainNo);
    else if (ordinals[idx]) send(ordinals[idx]);
  });
  window.__refreshChips = refreshDynamicChips;

  /* ── ?q= auto question ── */
  try {
    var q = new URLSearchParams(location.search).get('q');
    if (q && q.trim()) pendingQ = q.trim().slice(0, 300);
  } catch (err) {}
  function auto() {
    if (autoFired) return; autoFired = true;
    if (pendingQ && online) { var q = pendingQ; pendingQ = null; send(q); }
  }
  checkHealth(auto);
  setTimeout(auto, 4000); // health slow ho to bhi auto-send try karo

})();
</script>
</body>
</html>
